# The audit and governance modules look these beans up programmatically, so ArC cannot see that
# they are used. An application that sets quarkus.arc.unremovable-types itself must include them.
quarkus.arc.unremovable-types=io.casehub.ledger.api.spi.LedgerAppender,io.casehub.platform.api.identity.CurrentPrincipal,io.casehub.ledger.api.spi.TrustScoreSource,io.casehub.ledger.api.spi.OutcomeRecorder
